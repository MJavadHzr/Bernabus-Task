[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barn-ais-eval-001"
version = "0.1.0"
description = "Governed evaluation harness for a clinical retrieval-augmented generation system"
requires-python = ">=3.11"

# Versions pinned exactly (assignment technical requirement 3). They were set at
# scaffold time and MUST be verified by running `make install` on a clean machine
# before submission — Gate One is a clean-machine reproducibility gate.
dependencies = [
    "jsonschema==4.23.0",   # contract validation
    "pydantic==2.9.2",      # EvaluationRecord modelling
    "pyyaml==6.0.2",        # configs
    "numpy==2.1.3",         # rate arithmetic
    "pandas==2.2.3",        # CSV output
    "jinja2==3.1.4",        # summary + evaluation card rendering
]

[project.optional-dependencies]
judge = [
    "anthropic==0.39.0",    # LLM judge; unused when replaying a committed cache
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barn_eval = ["contracts/*.json", "judge/prompts/*/*.md"]

[project.scripts]
barn-eval = "barn_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
