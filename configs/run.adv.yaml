# Adversarial Run

run:
  seed: 20260815
  evaluation_version: "1.1.0"
  preprocessor_version: null
  experiment_id: "rag_generated_adversarial"
  output_dir: "results/runs"

data:
  patients: "data/synthetic/generated/patients.json"
  cases:
    - "evaluation_cases/generated/adv_evidence.jsonl"
    - "evaluation_cases/generated/adv_grounding.jsonl"
    - "evaluation_cases/generated/adv_robustness.jsonl"
  responses: "results/responses/rag_20260815T184636Z_pooled_dense_adv.jsonl"
  confirmations: "results/confirmations/"
  groundability_audit: "evaluation_cases/groundability_audit.jsonl"

paths:
  severity_map: "configs/severity_map.yaml"
  thresholds: "configs/thresholds.yaml"

response_source: "rag_prototype"
response_source_version: "v1"

retrieval:
  k: "retrieved_set_size"
  ordering_policy: "score"
  warn_on_null_score: true

judge:
  enabled: true
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  model: "openai/gpt-oss-20b:free"
  prompt_version: "v1"
  cache_dir: "results/judge_cache"
  replay_only: false
  temperature: 0.0
  max_tokens: 4096
  timeout: 120
  max_retries: 4
  request_interval: 2.0

failure_handling:
  on_missing_response: "record"
  on_load_error: "record"
  exit_nonzero_on_missing: true
  silently_drop_cases: false
